name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Pack
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.minver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          show-progress: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Install MinVer CLI
        run: dotnet tool install --global minver-cli

      - name: Determine Version
        id: minver
        run: |
          $version = minver -v e -b ${{ github.run_number }}
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "MinVer calculated version: $version"

      - name: Restore
        run: dotnet restore --verbosity Quiet

      - name: Build
        run: dotnet build -c release --no-restore -p:ContinuousIntegrationBuild=true -p:MinVerBuildMetadata=${{ github.run_number }}

      - name: Run tests
        run: dotnet test -c release --no-build --no-restore -- --report-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          retention-days: 1

      - name: Pack
        run: |
          dotnet pack -c release --no-restore --no-build `
            -p:MinVerBuildMetadata=${{ github.run_number }} `
            -p:PackageOutputPath=${{ runner.temp }}/packages

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/packages/*.nupkg
          retention-days: 90
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: pack
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nuget-packages
          path: ./packages

      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USERNAME }}

      - name: Push packages
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

      - name: Generate job summary
        if: success()
        run: |
          {
            echo "## :rocket: Release Published"
            echo ""
            echo "**Version:** ${{ needs.pack.outputs.version }}"
            echo ""
            echo "### Published Packages"
            for f in packages/*.nupkg; do
              echo "- \`$(basename "$f")\`"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
